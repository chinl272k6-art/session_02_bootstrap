<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>My Portfolio</title>

    <style>
        body{
            background-color:#f5f5f5;
        }

        .portfolio-box{
            background:white;
            border-radius:10px;
            padding:40px;
            margin-top:50px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .profile-img{
            width:100%;
            max-width:350px;
            border-radius:10px;
        }

        .nav-link{
            color:black;
        }

        .nav-link:hover{
            color:#0d6efd;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="portfolio-box">

        <!-- Header -->
        <div class="row align-items-center mb-5">

            <div class="col-md-6">
                <h1 class="display-6">
                    Nguyễn Linh Chi
                </h1>
            </div>

            <div class="col-md-6">
                <ul class="nav justify-content-md-end">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Projects
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact
                        </a>
                    </li>
                </ul>
            </div>

        </div>

        <!-- Content -->
        <div class="row align-items-center">

            <div class="col-lg-6 mb-4">

                <h3>Welcome!</h3>

                <p class="lead">
                    Tôi là sinh viên ngành CNTT.
                    Tôi đang học HTML, CSS và Bootstrap.
                    Đây là portfolio cá nhân dùng Bootstrap 5.
                </p>

                <button class="btn btn-primary">
                    Xem CV
                </button>

            </div>

            <div class="col-lg-6 text-center">

                <img
                src="images/avatar2.jpg"
                class="profile-img"
                alt="Ảnh cá nhân">

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
